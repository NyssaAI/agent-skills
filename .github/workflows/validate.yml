name: Validate plugin source and evaluation report

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r evals/requirements.txt
      - run: python scripts/assemble.py check
      - run: python scripts/assemble.py write
      - run: python scripts/assemble.py check
      - run: python scripts/validate.py
      - run: python evals/run.py validate
      - run: python -m pytest test/unit test/use_case
      - run: python evals/report.py check

  release-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python evals/report.py release
