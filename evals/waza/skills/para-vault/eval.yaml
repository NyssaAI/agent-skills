name: para-vault-eval
description: Fast local trigger checks for the para-vault skill.
skill: para-vault
schemaVersion: "1.4"
version: "0.6.4"
config:
  trials_per_task: 1
  timeout_seconds: 10
  parallel: false
  executor: mock
  model: mock
metrics:
  - name: trigger_quality
    weight: 1.0
    threshold: 1.0
    description: Does para-vault trigger for vault filing, inbox triage, reconciliation, archiving, navigation, and calendar/email ingestion without capturing general file moves or voice drafting?
tasks:
  - "tasks/*.yaml"
