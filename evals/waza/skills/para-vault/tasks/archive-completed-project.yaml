id: archive-completed-project
name: Trigger para-vault to archive a completed project in the vault
description: Lifecycle transition archiving a finished PARA project into Archives belongs to para-vault.
tags:
  - trigger
  - positive
inputs:
  prompt: "We finished the website redesign project. Can you archive this project in my PARA vault Archives?"
expected:
  should_trigger: true
graders:
  - type: trigger
    name: para-vault-positive-trigger
    config:
      skill_path: skills/para-vault/SKILL.md
      mode: positive
      threshold: 0.50
