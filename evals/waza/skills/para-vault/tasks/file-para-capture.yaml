id: file-para-capture
name: Trigger para-vault to file a capture note into a PARA project
description: Classifying and filing a capture note into an active PARA Project belongs to para-vault.
tags:
  - trigger
  - positive
inputs:
  prompt: "File this note into PARA under my active Project for product launch and organize my PARA vault."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: para-vault-positive-trigger
    config:
      skill_path: skills/para-vault/SKILL.md
      mode: positive
      threshold: 0.50
