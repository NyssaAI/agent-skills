id: rename-folder-collision
name: Trigger manage-file-operations for folder rename collision resolution
description: Renaming a folder and resolving a destination collision non-destructively belongs to manage-file-operations.
tags:
  - trigger
  - positive
inputs:
  prompt: "I need to rename folder client-docs, but there is already a folder with that name. Please resolve destination collision using non-destructive moves."
expected:
  should_trigger: true
graders:
  - type: trigger
    name: manage-file-operations-positive-trigger
    config:
      skill_path: skills/manage-file-operations/SKILL.md
      mode: positive
