name: Validate plugin source and evaluation report

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r evals/requirements.txt
      - run: python scripts/assemble.py check
      - run: python evals/run.py validate
      - run: python -m unittest discover -s test -q
      - run: python evals/report.py check

  release-evidence:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python evals/report.py release
